<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine – Advanced Discord Protection Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .neon-glow {
            text-shadow: 0 0 10px rgba(0, 123, 255, 0.8),
                         0 0 20px rgba(0, 123, 255, 0.6),
                         0 0 30px rgba(0, 123, 255, 0.4);
        }

        .neon-button {
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1f2e 100%);
            border: 2px solid #007bff;
            color: #ffffff;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: inline-block;
            margin: 10px;
        }

        .neon-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 123, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .neon-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.4);
            border-color: #00f;
        }

        .neon-button:hover::before {
            left: 100%;
        }

        .hero-section {
            text-align: center;
            padding: 60px 20px;
            max-width: 1200px;
            width: 100%;
        }

        .hero-section h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .hero-section p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #007bff,
                             0 0 20px #007bff,
                             0 0 30px #007bff,
                             0 0 40px #007bff;
            }
            to {
                text-shadow: 0 0 20px #00f,
                             0 0 30px #00f,
                             0 0 40px #00f,
                             0 0 50px #00f;
            }
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .buttons-container a {
            width: 250px;
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 26, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
        }

        .nav-logo .neon-glow {
            color: #007bff;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #007bff;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: #007bff;
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 2.5rem;
            }

            .hero-section p {
                font-size: 1.2rem;
            }

            .nav-bar {
                padding: 15px 20px;
            }

            .nav-links {
                gap: 20px;
            }

            .buttons-container a {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <div class="nav-logo">
            <span class="neon-glow">Divine</span> Bot
        </div>
        <div class="nav-links">
            <a href="commands/">Commands</a>
            <a href="https://discord.gg/XA99sc2bd8" target="_blank">Support</a>
            <a href="https://discord.com/oauth2/authorize?client_id=1397771394762408086&permissions=8&integration_type=0&scope=bot" target="_blank">Invite Bot</a>
        </div>
    </nav>

    <section class="hero-section">
        <h1 class="neon-glow">Divine – Advanced Discord Protection Bot</h1>
        <p>Powerful protection and moderation tools for your Discord server</p>
        <div class="buttons-container">
            <a href="https://discord.com/oauth2/authorize?client_id=1397771394762408086&permissions=8&integration_type=0&scope=bot" target="_blank" class="neon-button">Invite Bot</a>
            <a href="commands/" class="neon-button">Commands</a>
        </div>
    </section>
</body>
</html>
